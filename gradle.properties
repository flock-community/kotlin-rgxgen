# Daemon JVM args sized for the multi-target Kotlin Multiplatform build.
# Without a larger Metaspace, the daemon dies with OOM: Metaspace at the
# end of `./gradlew build` (Apple/iOS/tvOS/watchOS/wasm/JS/JVM all loaded).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
